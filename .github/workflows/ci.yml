name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash -n completions/2fa.bash scripts/*.sh
      - run: ruby tests/homebrew_delivery_test.rb
      - run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  homebrew:
    needs: rust
    strategy:
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Install and test binary formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap --custom-remote lalkalol1907/2fa-cli "$GITHUB_WORKSPACE"
          FORMULA="$(brew --repository lalkalol1907/2fa-cli)/Formula/twofa.rb"
          ruby scripts/generate-homebrew.rb dist "$FORMULA" "file://$GITHUB_WORKSPACE/dist"
          test -z "$(brew deps lalkalol1907/2fa-cli/twofa)"
          brew install lalkalol1907/2fa-cli/twofa
          brew test lalkalol1907/2fa-cli/twofa
