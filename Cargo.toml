[package]
name = "twofa"
version = "0.1.1"
edition = "2024"
description = "TOTP 2FA codes from the terminal"
license = "MIT"
homepage = "https://github.com/lalkalol1907/2fa-cli"
repository = "https://github.com/lalkalol1907/2fa-cli"
publish = false
autobins = false

[[bin]]
name = "2fa"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = "4.2.0"
rpassword = "7.5.4"
rqrr = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
url = "2.5.8"

[dev-dependencies]
qrcode = { version = "0.14.1", features = ["image"] }
